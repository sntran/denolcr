# The checks of each push and of each pull request:
#
# - npm test: the tests, with the oldest Node.js of package.json and the
#   newer versions. The job installs rclone, 7-Zip, Go, go-pmtiles,
#   versatiles, Azurite and pyftpdlib, thus the tests that compare rfetch
#   with these tools, or that run on them, run too.
# - deno fmt --check: the format of the files.
# - wasm: the tests of the crate of backend/crypt/secretbox.wasm, and its
#   build from its source gives the same bytes as the file in the repository.
#
# This workflow deploys nothing: the Pages project deploys the branches.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to a branch stops the old run of that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Go runs the tests of lib/list.js against encoding/csv.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # rclone reads each variable RCLONE_NAME as the flag --name. Thus the
      # version is not in a variable RCLONE_VERSION of the job: rclone reads
      # it as the flag --version, and fails.
      - name: Install rclone
        env:
          VERSION: 1.75.1
          SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
        run: |
          mkdir -p "$HOME/bin" "$RUNNER_TEMP/rclone"
          cd "$RUNNER_TEMP/rclone"
          zip="rclone-v$VERSION-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v$VERSION/$zip"
          echo "$SHA256  $zip" | sha256sum -c -
          unzip -q "$zip"
          install -m 755 "rclone-v$VERSION-linux-amd64/rclone" "$HOME/bin/rclone"
          "$HOME/bin/rclone" version
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "RCLONE=$HOME/bin/rclone" >> "$GITHUB_ENV"

      # 7-Zip reads RAR, zip and 7z: the tests of the archive backend
      # compare rfetch with it.
      - name: Install 7-Zip
        env:
          ARCHIVE: 7z2501-linux-x64.tar.xz
          SHA256: 4ca3b7c6f2f67866b92622818b58233dc70367be2f36b498eb0bdeaaa44b53f4
        run: |
          mkdir -p "$HOME/bin" "$RUNNER_TEMP/7zip"
          cd "$RUNNER_TEMP/7zip"
          curl -fsSLO "https://www.7-zip.org/a/$ARCHIVE"
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          tar -xJf "$ARCHIVE" 7zz
          install -m 755 7zz "$HOME/bin/7zz"
          "$HOME/bin/7zz" i | head -n 2
          echo "SEVENZIP=$HOME/bin/7zz" >> "$GITHUB_ENV"

      # go-pmtiles reads and writes PMTiles files: the tests of the tiles
      # backend compare rfetch with it. go install checks each module with
      # the checksum database of Go.
      - name: Install go-pmtiles
        env:
          VERSION: v1.31.2
        run: |
          GOBIN="$HOME/bin" go install "github.com/protomaps/go-pmtiles@$VERSION"
          "$HOME/bin/go-pmtiles" version
          echo "PMTILES=$HOME/bin/go-pmtiles" >> "$GITHUB_ENV"

      # versatiles reads and writes VersaTiles files: the tests of the tiles
      # backend compare rfetch with it.
      - name: Install versatiles
        env:
          VERSION: 4.15.0
          SHA256: adf3bef84ad006cb1cc37c2837bcae1a0effd94fe021e29d13a0325ab8bb1168
        run: |
          mkdir -p "$HOME/bin" "$RUNNER_TEMP/versatiles"
          cd "$RUNNER_TEMP/versatiles"
          archive=versatiles-linux-gnu-x86_64.tar.gz
          curl -fsSLO "https://github.com/versatiles-org/versatiles-rs/releases/download/v$VERSION/$archive"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" versatiles
          install -m 755 versatiles "$HOME/bin/versatiles"
          "$HOME/bin/versatiles" --version
          echo "VERSATILES=$HOME/bin/versatiles" >> "$GITHUB_ENV"

      # Azurite is the emulator of Azure Storage: the tests of the azureblob
      # backend run on it. npm checks the package with its integrity hash.
      - name: Install Azurite
        env:
          VERSION: 3.37.0
        run: |
          npm install --prefix "$RUNNER_TEMP/azurite" --no-save --no-audit \
            --no-fund "azurite@$VERSION"
          "$RUNNER_TEMP/azurite/node_modules/.bin/azurite-blob" --version
          echo "AZURITE=$RUNNER_TEMP/azurite/node_modules/.bin/azurite-blob" >> "$GITHUB_ENV"

      # pyftpdlib is a server of FTP, with explicit and implicit TLS through
      # pyOpenSSL: the tests of the ftp backend run on it. The versions of
      # all the packages are fixed.
      - name: Install pyftpdlib
        run: |
          python3 -m venv "$RUNNER_TEMP/pyftpdlib"
          "$RUNNER_TEMP/pyftpdlib/bin/pip" install --quiet --no-deps \
            pyftpdlib==2.2.0 pyasynchat==1.0.5 pyasyncore==1.0.5 \
            pyOpenSSL==26.4.0 cryptography==50.0.2 cffi==2.1.1 \
            pycparser==3.11 typing_extensions==4.16.0
          "$RUNNER_TEMP/pyftpdlib/bin/pip" check
          "$RUNNER_TEMP/pyftpdlib/bin/python" -I -c "from pyftpdlib.handlers import TLS_FTPHandler; import pyftpdlib.servers, pyftpdlib, OpenSSL; print(pyftpdlib.__ver__, OpenSSL.__version__)"
          echo "PYFTPDLIB_PYTHON=$RUNNER_TEMP/pyftpdlib/bin/python" >> "$GITHUB_ENV"

      - run: npm ci

      # A test against rclone, 7-Zip, Go, go-pmtiles, versatiles, Azurite or
      # pyftpdlib skips when the tool is not installed.
      # Here the tools are installed, thus such a skip is an error.
      - name: npm test
        shell: bash
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -E "((rclone|7-Zip|Go|go-pmtiles|versatiles|Azurite|openssl|pyftpdlib) is not installed|pyftpdlib, pyOpenSSL or openssl is not installed|node:sqlite is not in)" "$RUNNER_TEMP/test.log"; then
            echo "::error::A test skipped because a tool is not installed."
            exit 1
          fi

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - run: deno fmt --check

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/crypt/native
    steps:
      - uses: actions/checkout@v4

      # The compiler of rust-toolchain.toml, with the target of WebAssembly.
      - name: Install Rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --target wasm32-unknown-unknown

      # The tests compare each box with the crate crypto_secretbox, on the
      # machine of the job.
      - run: cargo test --locked

      - run: ./build.sh

      - name: Compare with the file in the repository
        run: git diff --exit-code -- ../secretbox.wasm
